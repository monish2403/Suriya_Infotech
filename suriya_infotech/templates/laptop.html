<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css" integrity="sha512-9xKTRVabjVeZmc+GUW8GgSmcREDunMM+Dt/GrzchfN8tkwHizc5RP4Ok/MXFFy5rIjJjzhndFScTceq5e6GvVQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    
    <link rel="stylesheet" href="../static/css/laptop.css">
</head>
<body>    
<section class="laptop-section py-5">
    <div class="container">
  
      <!-- 🔘 Brand Buttons -->
      <div class="mb-4 text-center">
        <button class="btn me-2 lap-btn">ASUS</button>
        <button class="btn me-2 lap-btn">HP</button>
        <button class="btn me-2 lap-btn">DELL</button>
        <button class="btn me-2 lap-btn">LENOVO</button>
        <button class="btn me-2 lap-btn">ACER</button>
        <button class="btn me-2 lap-btn">SAMSUNG</button>
        <button class="btn lap-btn">APPLE</button>
      </div>
  
      <!-- 🖥️ Laptop Cards -->
      <div class="row g-4">
  
        <!-- Card 1 -->
        <div class="col-md-4">
          <div class="card h-100 laptop-card shadow-sm">
            <img src="https://source.unsplash.com/600x400/?laptop,asus" class="card-img-top" alt="ASUS Laptop">
            <div class="card-body">
              <h5 class="fw-bold">ASUS Vivobook 15</h5>
              <p class="text-muted small mb-2">Intel i5 • 8GB RAM • 512GB SSD • Windows 11</p>
              <div class="d-flex justify-content-between">
                <a href="#" class="btn btn-sm btn-outline-secondary">View</a>
                <a href="#" class="btn btn-sm btn-primary"><i class="fas fa-cart-plus me-1"></i>Add to Cart</a>
              </div>
            </div>
          </div>
        </div>
  
        <!-- Card 2 -->
        <div class="col-md-4">
          <div class="card h-100 laptop-card shadow-sm">
            <img src="https://source.unsplash.com/600x400/?laptop,hp" class="card-img-top" alt="HP Laptop">
            <div class="card-body">
              <h5 class="fw-bold">HP Pavilion</h5>
              <p class="text-muted small mb-2">Ryzen 5 • 16GB RAM • 1TB SSD • AMD Graphics</p>
              <div class="d-flex justify-content-between">
                <a href="#" class="btn btn-sm btn-outline-secondary">View</a>
                <a href="#" class="btn btn-sm btn-primary"><i class="fas fa-cart-plus me-1"></i>Add to Cart</a>
              </div>
            </div>
          </div>
        </div>
  
        <!-- Card 3 -->
        <div class="col-md-4">
          <div class="card h-100 laptop-card shadow-sm">
            <img src="https://source.unsplash.com/600x400/?laptop,dell" class="card-img-top" alt="DELL Laptop">
            <div class="card-body">
              <h5 class="fw-bold">DELL XPS 13</h5>
              <p class="text-muted small mb-2">Intel i7 • 16GB RAM • 512GB SSD • 13.3" 4K Display</p>
              <div class="d-flex justify-content-between">
                <a href="#" class="btn btn-sm btn-outline-secondary">View</a>
                <a href="#" class="btn btn-sm btn-primary"><i class="fas fa-cart-plus me-1"></i>Add to Cart</a>
              </div>
            </div>
          </div>
        </div>
  
        <!-- More cards can be added here -->
  
      </div>
    </div>
  </section>
</body>
</html>
