<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suriya Infotech | Home</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

    <!-- Custom CSS -->
     <link rel="stylesheet" href="../static/css/home.css">
</head>
<body>
    <section id="heroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <div class="carousel-inner">
      
          <!-- Slide 1 -->
          <div class="carousel-item active">
            <div class="hero-slide d-flex align-items-center justify-content-center text-center text-white" style="background-image: url('../static/assets/hero1.jpg');">
              <div class="overlay"></div>
              <div class="z-1 position-relative">
                <h1 class="display-4 hero-heading">Welcome to Suriya Infotech</h1>
                <p class="lead">Explore our wide range of laptops & accessories</p>
                <a href="#" class="btn">Shop Now</a>
              </div>
            </div>
          </div>
      
          <!-- Slide 2 -->
          <div class="carousel-item">
            <div class="hero-slide d-flex align-items-center justify-content-center text-center text-white" style="background-image: url('../static/assets/hero2.jpg');">
              <div class="overlay"></div>
              <div class="z-1 position-relative">
                <h1 class="display-4 hero-heading">Refurbished Tech. Unbeatable Prices.</h1>
                <p class="lead">High quality. Low cost. Like-new performance.</p>
                <a href="#" class="btn">View Refurbished</a>
              </div>
            </div>
          </div>
      
          <!-- Slide 3 -->
          <div class="carousel-item">
            <div class="hero-slide d-flex align-items-center justify-content-center text-center text-white" style="background-image: url('../static/assets/hero3.jpg');">
              <div class="overlay"></div>
              <div class="z-1 position-relative">
                <h1 class="display-4 hero-heading">Gaming Laptops & Accessories</h1>
                <p class="lead">Play hard with performance gear</p>
                <a href="#" class="btn">Browse Gaming</a>
              </div>
            </div>
          </div>
      
        </div>
      
        <!-- Optional Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
      </section>
      
      <!-- Bootstrap JS -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

      <!-- Custom JS -->
       <script src="../static/js/home.js"></script>
</body>
</html>
